<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到</title>

<style>
/* 简单样式设置 */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  line-height: 1.6;
  background-color: #f9f9f9;
  color: #333;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  text-align: center;
}

h1 {
  font-size: 4em;
  margin-bottom: 0.5em;
  color: #4CAF50;
}

p {
  font-size: 1.2em;
  margin-bottom: 1.5em;
}

a {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  cursor: pointer;
  border-radius: 5px;
  transition: background-color 0.3s;
}

a:hover {
  background-color: #45a049;
}
</style>
</head>
<body>
<div class="container">
  <h1>404</h1>
  <p>抱歉，您访问的页面不存在。</p>
  <a href="/index.html">返回首页</a>
</div>
</body>
</html>
